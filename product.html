<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product — NESSIM Jewelry</title><link rel="stylesheet" href="assets/styles.css"><style>.detail-wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:7vw;align-items:start}.detail-photo{aspect-ratio:4/5;background:#ddd6cb}.detail-copy{position:sticky;top:120px;padding-top:40px}.detail-copy h1{font:600 clamp(42px,5vw,66px)/.92 var(--serif);margin:14px 0}.detail-price{font:600 28px var(--serif);color:var(--gold)}.detail-copy p{font-size:12px;color:var(--slate);line-height:1.9}.sizes{display:flex;gap:8px;margin:25px 0}.size{flex:1;border:1px solid var(--line);background:none;padding:13px}.size.active{background:var(--ink);color:white}@media(max-width:760px){.detail-wrap{grid-template-columns:1fr}.detail-copy{position:static;padding-top:0}}</style></head><body><div data-header></div><main><section class="section"><div class="container detail-wrap"><div class="detail-photo"><img data-image alt=""></div><div class="detail-copy"><span class="eyebrow gold">NESSIM · 925 Silver</span><h1 data-name></h1><div class="detail-price" data-price></div><p>A refined NESSIM signature, hand-finished in Cairo using premium 925 sterling silver and selected stones. Designed to be worn, remembered and passed on.</p><div class="sizes"><button class="size active">40 cm</button><button class="size">42 cm</button><button class="size">45 cm</button></div><button class="button" data-add style="width:100%">Add to bag</button></div></div></section></main><div data-footer></div><div data-mobile-bar></div><script src="assets/app.js"></script><script>renderShell('shop');const id=new URLSearchParams(location.search).get('id');const p=getProducts().find(x=>x.id===id)||getProducts()[0];document.querySelector('[data-image]').src=p.image;document.querySelector('[data-name]').textContent=p.name;document.querySelector('[data-price]').textContent=money(p.price);document.querySelector('[data-add]').onclick=()=>addToCart(p.id);document.querySelectorAll('.size').forEach(b=>b.onclick=()=>{document.querySelectorAll('.size').forEach(x=>x.classList.remove('active'));b.classList.add('active')})</script></body></html>
