<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090b"><title>Staff Login — NESSIM</title><link rel="stylesheet" href="assets/styles.css"></head><body><main class="auth-page"><section class="login-card"><a class="login-brand" href="index.html">NESSIM<small>CONTROL · 1955</small></a><h1 data-title>Welcome back.</h1><p data-subtitle>Secure access for NESSIM administrators and catalog staff.</p><div class="login-error" data-error>Incorrect username or password.</div><form data-login><div class="field"><label>Username</label><input name="username" required autocomplete="username" placeholder="Enter your username"></div><div class="field"><label>Password</label><input name="password" required type="password" minlength="8" autocomplete="current-password" placeholder="Enter your password"></div><button class="button" data-submit style="width:100%;margin-top:8px">Sign in securely</button></form><div class="permission-note" data-note style="display:none;margin-top:20px;color:var(--slate);background:#eee9df;border-color:#ddd4c6"><b>First-time setup</b><br>Create the private Administrator credentials for this browser. No password is published in the website code.</div><a class="back-link" href="index.html">← Return to storefront</a></section></main><script>
async function hash(v){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const firstRun=!JSON.parse(localStorage.getItem('nessim_users')||'[]').length;if(firstRun){document.querySelector('[data-title]').textContent='Create admin access.';document.querySelector('[data-subtitle]').textContent='Set up the owner account for this private demo browser.';document.querySelector('[data-submit]').textContent='Create administrator';document.querySelector('[data-note]').style.display='block'}
document.querySelector('[data-login]').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),username=f.get('username').trim().toLowerCase(),passwordHash=await hash(f.get('password'));let users=JSON.parse(localStorage.getItem('nessim_users')||'[]'),user;if(!users.length){user={id:'U-001',name:'NESSIM Administrator',username,role:'Administrator',passwordHash,active:true};users=[user];localStorage.setItem('nessim_users',JSON.stringify(users))}else user=users.find(x=>x.username.toLowerCase()===username&&x.passwordHash===passwordHash&&x.active);if(!user){document.querySelector('[data-error]').classList.add('show');return}const session={id:user.id,name:user.name,username:user.username,role:user.role,expires:Date.now()+4*60*60*1000};sessionStorage.setItem('nessim_session',JSON.stringify(session));const activity=JSON.parse(localStorage.getItem('nessim_activity')||'[]');activity.unshift({time:new Date().toISOString(),user:user.name,action:'Signed in to NESSIM Control'});localStorage.setItem('nessim_activity',JSON.stringify(activity.slice(0,100)));location.href='admin.html'};
</script></body></html>
