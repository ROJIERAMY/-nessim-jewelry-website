<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop — NESSIM Jewelry</title><link rel="stylesheet" href="assets/styles.css"></head><body><div data-header></div><main><section class="page-hero"><div class="container"><span class="eyebrow gold">The NESSIM collection</span><h1>Jewelry with intention.</h1><p>Explore signature silver pieces shaped by Egyptian craft and finished for modern life.</p></div></section><section class="section"><div class="container"><div class="filters"><button class="filter active" data-filter="All">All pieces</button><button class="filter" data-filter="Necklaces">Necklaces</button><button class="filter" data-filter="Rings">Rings</button><button class="filter" data-filter="Earrings">Earrings</button></div><div class="product-grid" data-products></div></div></section></main><div data-footer></div><div data-mobile-bar></div><script src="assets/app.js"></script><script>renderShell('shop');const box=document.querySelector('[data-products]');function draw(c='All'){box.innerHTML=getProducts().filter(p=>c==='All'||p.category===c).map(productCard).join('')}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');draw(b.dataset.filter)});const q=new URLSearchParams(location.search).get('category');const start=[...document.querySelectorAll('[data-filter]')].find(b=>b.dataset.filter===q);start?start.click():draw()</script></body></html>
